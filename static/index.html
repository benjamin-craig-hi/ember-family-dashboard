<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Dashboard</title>
<style>
  :root { --bg:#0f1115; --panel:#1a1d24; --accent:#ff7a1a; --text:#e8e8e8; --muted:#8a8f98; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { padding:18px 24px; font-size:1.6rem; font-weight:700; border-bottom:1px solid #262a33; }
  header span { color:var(--accent); }

  /* Calendar takes ~3/4; chores + notes share the right ~1/4 */
  main { flex:1; display:grid; grid-template-columns:3fr 1fr; gap:16px; padding:16px; overflow:hidden; min-height:0; }

  .cal-pane { background:var(--panel); border-radius:12px; padding:16px; display:flex; flex-direction:column; overflow:hidden; min-height:0; }
  .right-col { display:flex; flex-direction:column; gap:16px; overflow:hidden; min-height:0; }
  .col { background:var(--panel); border-radius:12px; padding:16px; display:flex; flex-direction:column; overflow:hidden; min-height:0; flex:1; }
  .col h2 { font-size:1.1rem; margin-bottom:12px; color:var(--accent); }
  .list { flex:1; overflow-y:auto; }
  .item { background:#22262f; border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .item .t { font-weight:600; }
  .item .d { color:var(--muted); font-size:.85rem; margin-top:2px; }
  .chore-item { display:flex; align-items:center; gap:10px; }
  .chore-item input[type=checkbox] { width:20px; height:20px; flex:none; accent-color:var(--accent); cursor:pointer; }
  .chore-item .t { flex:1; }
  .chore-item.done .t { text-decoration:line-through; color:var(--muted); }
  .add { display:flex; gap:8px; margin-top:10px; }
  .add input { flex:1; background:#22262f; border:1px solid #333a46; color:var(--text); border-radius:8px; padding:10px; font-size:1rem; }
  .add button { background:var(--accent); color:#111; border:none; border-radius:8px; padding:10px 16px; font-weight:700; cursor:pointer; }

  /* ---- Calendar ---- */
  .cal-toolbar { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .cal-toolbar h2 { font-size:1.25rem; color:var(--accent); flex:1; }
  .cal-nav { background:#22262f; color:var(--text); border:1px solid #333a46; border-radius:8px; width:36px; height:36px; font-size:1.3rem; line-height:1; cursor:pointer; }
  .cal-today { background:#22262f; color:var(--text); border:1px solid #333a46; border-radius:8px; padding:8px 14px; font-size:.9rem; cursor:pointer; }
  .cal-weekdays { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:4px; }
  .cal-weekdays span { text-align:center; color:var(--muted); font-size:.8rem; font-weight:600; }
  .cal-grid { flex:1; display:grid; grid-template-columns:repeat(7,1fr); grid-template-rows:repeat(6,1fr); gap:4px; min-height:0; }
  .cal-cell { background:#22262f; border-radius:6px; padding:6px; overflow:hidden; display:flex; flex-direction:column; }
  .cal-cell.empty { background:transparent; }
  .cal-cell.today { outline:2px solid var(--accent); }
  .cal-num { font-weight:700; color:var(--muted); font-size:.85rem; margin-bottom:3px; }
  .cal-cell.today .cal-num { color:var(--accent); }
  .cal-ev { background:#2a2f3a; border-radius:4px; padding:2px 5px; font-size:.72rem; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cal-ev-time { color:var(--accent); font-weight:600; }
  .cal-upcoming-wrap { margin-top:10px; border-top:1px solid #262a33; padding-top:10px; }
  .cal-upcoming-wrap h3 { font-size:.9rem; color:var(--muted); margin-bottom:6px; }
  #cal-upcoming { max-height:120px; overflow-y:auto; }

  footer { display:flex; gap:12px; padding:12px 16px; border-top:1px solid #262a33; }
  #chatbox { flex:1; display:flex; gap:8px; }
  #chatbox input { flex:1; background:#1a1d24; border:1px solid #333a46; color:var(--text); border-radius:8px; padding:12px; font-size:1rem; }
  #chatbox button { background:var(--accent); color:#111; border:none; border-radius:8px; padding:12px 20px; font-weight:700; cursor:pointer; }
  #talk { background:#2a6f4a; color:#fff; border:none; border-radius:8px; padding:12px 20px; font-weight:700; cursor:pointer; }
  #reply { padding:12px 16px; color:var(--muted); font-size:.95rem; min-height:20px; }

  /* ---- On-screen keyboard (25% larger) ---- */
  #osk {
    position:fixed; left:0; right:0; bottom:0; z-index:1000;
    background:#14171d; border-top:2px solid #333a46; padding:12px 10px 16px;
    display:none; flex-direction:column; gap:8px;
  }
  #osk.show { display:flex; }
  .osk-row { display:flex; gap:8px; justify-content:center; }
  .osk-key {
    flex:1; max-width:90px; height:65px; background:#22262f; border:1px solid #333a46;
    color:var(--text); border-radius:8px; font-size:1.45rem; font-weight:600;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  .osk-key:active { background:var(--accent); color:#111; }
  .osk-key.wide { max-width:138px; }
  .osk-key.space { max-width:425px; }
  .osk-key.fn { background:#2a2f3a; color:var(--accent); }
  .osk-key.done { background:var(--accent); color:#111; }
</style>
</head>
<body>
<header>Family <span>Dashboard</span></header>
<main>
  <div class="cal-pane">
    <div class="cal-toolbar">
      <button class="cal-nav" onclick="calShift(-1)">&#8249;</button>
      <h2 id="cal-title">Calendar</h2>
      <button class="cal-nav" onclick="calShift(1)">&#8250;</button>
      <button class="cal-today" onclick="calToday()">Today</button>
    </div>
    <div class="cal-weekdays">
      <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-upcoming-wrap">
      <h3>Upcoming / unscheduled</h3>
      <div class="list" id="cal-upcoming"></div>
    </div>
  </div>
  <div class="right-col">
    <div class="col">
      <h2>Chores</h2>
      <div class="list" id="chores"></div>
      <div class="add"><input id="chore-in" placeholder="Add a chore..."><button onclick="addChore()">+</button></div>
    </div>
    <div class="col">
      <h2>Notes</h2>
      <div class="list" id="notes"></div>
      <div class="add"><input id="note-in" placeholder="Add a note..."><button onclick="addNote()">+</button></div>
    </div>
  </div>
</main>
<div id="reply"></div>
<footer>
  <div id="chatbox"><input id="chat-in" placeholder="Ask the assistant..."><button onclick="ask()">Send</button></div>
  <button id="talk" onclick="talk()">🎤 Talk</button>
</footer>

<!-- On-screen keyboard -->
<div id="osk">
  <div class="osk-row">
    <span class="osk-key" data-k="1">1</span><span class="osk-key" data-k="2">2</span>
    <span class="osk-key" data-k="3">3</span><span class="osk-key" data-k="4">4</span>
    <span class="osk-key" data-k="5">5</span><span class="osk-key" data-k="6">6</span>
    <span class="osk-key" data-k="7">7</span><span class="osk-key" data-k="8">8</span>
    <span class="osk-key" data-k="9">9</span><span class="osk-key" data-k="0">0</span>
    <span class="osk-key fn" data-k="backspace">⌫</span>
  </div>
  <div class="osk-row">
    <span class="osk-key" data-k="q">q</span><span class="osk-key" data-k="w">w</span>
    <span class="osk-key" data-k="e">e</span><span class="osk-key" data-k="r">r</span>
    <span class="osk-key" data-k="t">t</span><span class="osk-key" data-k="y">y</span>
    <span class="osk-key" data-k="u">u</span><span class="osk-key" data-k="i">i</span>
    <span class="osk-key" data-k="o">o</span><span class="osk-key" data-k="p">p</span>
  </div>
  <div class="osk-row">
    <span class="osk-key wide fn" data-k="shift">⇧</span>
    <span class="osk-key" data-k="a">a</span><span class="osk-key" data-k="s">s</span>
    <span class="osk-key" data-k="d">d</span><span class="osk-key" data-k="f">f</span>
    <span class="osk-key" data-k="g">g</span><span class="osk-key" data-k="h">h</span>
    <span class="osk-key" data-k="j">j</span><span class="osk-key" data-k="k">k</span>
    <span class="osk-key" data-k="l">l</span>
    <span class="osk-key wide fn" data-k="enter">⏎</span>
  </div>
  <div class="osk-row">
    <span class="osk-key wide fn" data-k="123">123</span>
    <span class="osk-key" data-k="z">z</span><span class="osk-key" data-k="x">x</span>
    <span class="osk-key" data-k="c">c</span><span class="osk-key" data-k="v">v</span>
    <span class="osk-key" data-k="b">b</span><span class="osk-key" data-k="n">n</span>
    <span class="osk-key" data-k="m">m</span>
    <span class="osk-key" data-k=",">,</span><span class="osk-key" data-k=".">.</span>
    <span class="osk-key wide fn" data-k="space">␣</span>
  </div>
  <div class="osk-row">
    <span class="osk-key space fn" data-k="space">space</span>
    <span class="osk-key done" data-k="done">Done</span>
  </div>
</div>

<script>
// ---- On-screen keyboard ----
const osk = document.getElementById('osk');
let activeInput = null;
let shift = false;

function showOsk(input) {
  activeInput = input;
  osk.classList.add('show');
}
function hideOsk() {
  osk.classList.remove('show');
  activeInput = null;
}

// Show keyboard when any text input/textarea is focused
document.addEventListener('focusin', (e) => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) {
    showOsk(t);
  }
});
// Hide when focus leaves a text field (but not when moving between keys)
document.addEventListener('focusout', (e) => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) {
    // small delay so tapping a key doesn't hide the keyboard first
    setTimeout(() => {
      if (document.activeElement === document.body || !(document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA'))) {
        hideOsk();
      }
    }, 150);
  }
});

// Key handling
osk.addEventListener('click', (e) => {
  const key = e.target.closest('.osk-key');
  if (!key || !activeInput) return;
  const k = key.dataset.k;
  const el = activeInput;
  const start = el.selectionStart ?? el.value.length;
  const end = el.selectionEnd ?? el.value.length;

  if (k === 'backspace') {
    if (start === end && start > 0) {
      el.value = el.value.slice(0, start - 1) + el.value.slice(end);
      el.setSelectionRange(start - 1, start - 1);
    } else if (start !== end) {
      el.value = el.value.slice(0, start) + el.value.slice(end);
      el.setSelectionRange(start, start);
    }
  } else if (k === 'enter') {
    hideOsk();
    // trigger the associated action if it's the chat box
    if (el.id === 'chat-in') ask();
    else if (el.id === 'chore-in') addChore();
    else if (el.id === 'note-in') addNote();
  } else if (k === 'shift') {
    shift = !shift;
    document.querySelectorAll('.osk-key[data-k]').forEach(kk => {
      const c = kk.dataset.k;
      if (c && c.length === 1 && /[a-z]/.test(c)) {
        kk.textContent = shift ? c.toUpperCase() : c;
      }
    });
  } else if (k === '123') {
    // toggle not implemented; keep simple
  } else if (k === 'space') {
    el.value = el.value.slice(0, start) + ' ' + el.value.slice(end);
    el.setSelectionRange(start + 1, start + 1);
  } else if (k === 'done') {
    // Dismiss the keyboard and drop focus so it stays hidden.
    hideOsk();
    el.blur();
    return;
  } else {
    const ch = shift && /[a-z]/.test(k) ? k.toUpperCase() : k;
    el.value = el.value.slice(0, start) + ch + el.value.slice(end);
    el.setSelectionRange(start + 1, start + 1);
  }
  el.focus();
});

// ---- Dashboard logic ----
let _last = { cal: '', chores: '', notes: '' };
let _events = [];
let _calView = { y: 0, m: 0 };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function initCalView() {
  const now = new Date();
  _calView.y = now.getFullYear();
  _calView.m = now.getMonth();
}

// Resolve a free-text "day" field to a Date (or null if it can't be placed).
function resolveDay(dayStr) {
  const s = String(dayStr || '').trim().toLowerCase();
  if (!s) return null;
  const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (iso) return new Date(+iso[1], +iso[2] - 1, +iso[3]);
  const now = new Date(); now.setHours(0, 0, 0, 0);
  if (s === 'today') return now;
  if (s === 'tomorrow') { const d = new Date(now); d.setDate(d.getDate() + 1); return d; }
  if (s === 'yesterday') { const d = new Date(now); d.setDate(d.getDate() - 1); return d; }
  const days = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  const idx = days.indexOf(s);
  if (idx >= 0) {
    const d = new Date(now);
    let diff = idx - d.getDay();
    if (diff < 0) diff += 7;   // next occurrence of that weekday
    d.setDate(d.getDate() + diff);
    return d;
  }
  return null;
}

function renderCalendar() {
  const y = _calView.y, m = _calView.m;
  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const today = new Date(); today.setHours(0, 0, 0, 0);
  document.getElementById('cal-title').textContent = first.toLocaleString('en-US', { month: 'long', year: 'numeric' });

  let cells = '';
  for (let i = 0; i < startDow; i++) cells += '<div class="cal-cell empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(y, m, d);
    const isToday = date.getTime() === today.getTime();
    const evs = _events.filter(e => {
      const rd = resolveDay(e.day);
      return rd && rd.getTime() === date.getTime();
    });
    const evHtml = evs.map(e =>
      '<div class="cal-ev">' + (e.time ? '<span class="cal-ev-time">' + esc(e.time) + '</span> ' : '') + esc(e.title) + '</div>'
    ).join('');
    cells += '<div class="cal-cell' + (isToday ? ' today' : '') + '"><div class="cal-num">' + d + '</div>' + evHtml + '</div>';
  }
  const total = startDow + daysInMonth;
  const rem = total % 7;
  if (rem) for (let i = 0; i < 7 - rem; i++) cells += '<div class="cal-cell empty"></div>';
  document.getElementById('cal-grid').innerHTML = cells;

  const upcoming = _events.filter(e => {
    const rd = resolveDay(e.day);
    if (!rd) return true;
    return rd.getFullYear() !== y || rd.getMonth() !== m;
  });
  const upHtml = upcoming.map(e =>
    '<div class="item"><div class="t">' + esc(e.title) + '</div><div class="d">' + [e.day, e.time].filter(Boolean).join(' · ') + '</div></div>'
  ).join('');
  document.getElementById('cal-upcoming').innerHTML = upHtml || '<div class="item"><div class="t">No upcoming events</div></div>';
}

function calShift(delta) {
  _calView.m += delta;
  if (_calView.m < 0) { _calView.m = 11; _calView.y--; }
  if (_calView.m > 11) { _calView.m = 0; _calView.y++; }
  renderCalendar();
}
function calToday() {
  const now = new Date();
  _calView.y = now.getFullYear();
  _calView.m = now.getMonth();
  renderCalendar();
}

async function loadCalendar() {
  const r = await fetch('/api/calendar');
  const d = await r.json();
  const key = JSON.stringify(d);
  if (key !== _last.cal) { _last.cal = key; _events = d; renderCalendar(); }
}
async function loadChores() {
  const r = await fetch('/api/chores');
  const d = await r.json();
  const html = d.map((c, i) => {
    const done = !!c.done;
    return '<div class="item chore-item' + (done ? ' done' : '') + '">' +
      '<input type="checkbox" ' + (done ? 'checked' : '') + ' onchange="toggleChore(' + i + ', this.checked)">' +
      '<div class="t">' + esc(c.title || '') + '</div>' +
      (c.day ? '<div class="d">' + esc(c.day) + '</div>' : '') +
      '</div>';
  }).join('') || '<div class="item"><div class="t">No chores</div></div>';
  const key = JSON.stringify(d);
  if (key !== _last.chores) { _last.chores = key; document.getElementById('chores').innerHTML = html; }
}
async function toggleChore(i, checked) {
  await fetch('/api/chores/' + i + '/done', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ done: checked }) });
  loadChores();
}
async function loadNotes() {
  const r = await fetch('/api/notes');
  const d = await r.json();
  const html = d.map(n => '<div class="item"><div class="t">' + esc(n.text || '') + '</div></div>').join('') || '<div class="item"><div class="t">No notes</div></div>';
  const key = JSON.stringify(d);
  if (key !== _last.notes) { _last.notes = key; document.getElementById('notes').innerHTML = html; }
}
function refreshAll() { loadCalendar(); loadChores(); loadNotes(); }
async function addChore() {
  const i = document.getElementById('chore-in');
  if (!i.value) return;
  await fetch('/api/chores', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: i.value, day: '', done: false }) });
  i.value = '';
  loadChores();
}
async function addNote() {
  const i = document.getElementById('note-in');
  if (!i.value) return;
  await fetch('/api/notes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: i.value }) });
  i.value = '';
  loadNotes();
}
async function ask() {
  const i = document.getElementById('chat-in');
  if (!i.value) return;
  const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content: i.value }) });
  const d = await r.json();
  document.getElementById('reply').textContent = d.reply;
  i.value = '';
  refreshAll();
}
function talk() { document.getElementById('reply').textContent = 'Voice assistant is listening for the wake word.'; }

initCalView();
refreshAll();
// Auto-refresh: poll for changes so entries added by the agent (chat or voice)
// appear without a manual F5. Diff-aware loaders prevent flicker on no-change polls.
setInterval(refreshAll, 3000);
</script>
</body>
</html>
